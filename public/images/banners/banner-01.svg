<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="420" viewBox="0 0 1920 420">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a8c3a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#43a047;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#81c784;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="420" fill="url(#bg1)"/>
  <!-- 太阳 -->
  <circle cx="1500" cy="100" r="80" fill="#fff" opacity="0.15"/>
  <circle cx="1500" cy="100" r="50" fill="#fff" opacity="0.25"/>
  <!-- 山丘 -->
  <ellipse cx="500" cy="420" rx="600" ry="180" fill="#2e7d32" opacity="0.3"/>
  <ellipse cx="1400" cy="420" rx="700" ry="200" fill="#2e7d32" opacity="0.25"/>
  <!-- 叶子图案 -->
  <g transform="translate(200,180)" opacity="0.12">
    <path d="M0,0 Q30,-50 60,0 Q30,50 0,0" fill="#fff"/>
    <path d="M40,-10 Q70,-60 100,-10 Q70,40 40,-10" fill="#fff"/>
  </g>
  <!-- 文字 -->
  <text x="160" y="220" font-family="Microsoft YaHei, sans-serif" font-size="52" font-weight="bold" fill="#fff">新鲜溯源 · 健康直达</text>
  <text x="160" y="280" font-family="Microsoft YaHei, sans-serif" font-size="28" fill="#ffffffcc">从田间到餐桌，让每一份农产品都有迹可循</text>
  <!-- 装饰线 -->
  <rect x="160" y="300" width="80" height="4" rx="2" fill="#fff" opacity="0.6"/>
</svg>
