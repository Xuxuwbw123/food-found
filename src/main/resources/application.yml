server:
  port: 8088

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 关键: 强制 utf8mb4 连接,防止 characterEncoding=utf-8
    # 被 Connector/J 8.x 翻译为 SET NAMES utf8(3 字节上限),导致中文被替换为 ? 存入数据库
    url: jdbc:mysql://127.0.0.1:3306/fresh_trace_shop?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true
    hikari:
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci"
    username: root
    password: yaomingdada233
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/,file:./dist/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

jwt:
  secret: fresh-trace-unified-secret-key-2026
  access-expiration: 86400000
  refresh-expiration: 604800000

# Bug #31 fix: 上传路径
upload:
  path: ${user.dir}/uploads
